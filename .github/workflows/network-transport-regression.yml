name: Browser network transport

on:
  push:
    branches: [main]
    paths:
      - web/network_transport.js
      - scripts/test_network_transport.mjs
      - .github/workflows/network-transport-regression.yml
  pull_request:
    paths:
      - web/network_transport.js
      - scripts/test_network_transport.mjs
      - .github/workflows/network-transport-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test_network_transport.mjs
