name: Canvas integration validation
on:
  push:
    branches: [integration/optimization-rollup]
    paths: [.github/workflows/integration-canvas-check.yml]
permissions:
  contents: read
  actions: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools xvfb
      - uses: actions/download-artifact@v4
        with:
          name: integrated-wasm
          run-id: 33933267595
          github-token: ${{ github.token }}
          path: compiled
      - name: Prepare page and select an installed Mesa software ICD
        run: |
          set -euo pipefail
          mkdir smoke-web
          cp -r web/* smoke-web/
          cp compiled/voxy_wasm.{js,wasm,data} smoke-web/
          sed -i 's/__VOXY_BUILD_ID__/b0cf3a4179fafb2a235b8dbd26b06846ebb9ef45/g' smoke-web/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/smoke_integrated_wasm.mjs');s=p.read_text()
          s=s.replace("'--use-vulkan=swiftshader'","'--use-vulkan=native'")
          s=s.replace("'--use-webgpu-adapter=swiftshader',",'')
          p.write_text(s)
          PY
          node --check scripts/smoke_integrated_wasm.mjs
          mkdir -p /tmp/voxys-runtime && chmod 700 /tmp/voxys-runtime
          mapfile -t ICDS < <(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -type f)
          test "${#ICDS[@]}" -eq 1
          test -s "${ICDS[0]}"
          echo "VK_ICD_FILENAMES=${ICDS[0]}" >> "$GITHUB_ENV"
      - name: Actual terrain and course startup on Mesa Vulkan
        env:
          XDG_RUNTIME_DIR: /tmp/voxys-runtime
          VOXY_SMOKE_SHADER_DIR: shaders
        run: |
          set -euo pipefail
          vulkaninfo --summary > canvas-vulkan.txt 2>&1
          xvfb-run -a node scripts/smoke_integrated_wasm.mjs smoke-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-startup-reports
          path: |
            *startup*report.json
            canvas-vulkan.txt
          if-no-files-found: ignore
