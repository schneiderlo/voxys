name: Final frame budget validation
on:
  push:
    branches: [perf/frame-budget-1ms]
    paths: [.github/workflows/frame-budget-work.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain measured FFT improvement and reject slower finalize tiling
        id: apply
        run: |
          set -euo pipefail
          git show 077c1e97d9889de8584206b7cce6e24dd7e7972a:shaders/water_finalize.wgsl > shaders/water_finalize.wgsl
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_water_fft_fusion.mjs');s=p.read_text()
          a="[['fused FFT',true,false],['tiled finalize',false,true],['both',true,true]]"
          assert s.count(a)==1
          s=s.replace(a,"[['production fused FFT',true,true]]")
          s=s.replace('fused,tiled,stopRows=false','fused,candidateFinalize,stopRows=false').replace('tiled?finish1:finish0','candidateFinalize?finish1:finish0').replace('[name,fused,tiled]','[name,fused,candidateFinalize]').replace('i?tiled:false','i?candidateFinalize:false')
          p.write_text(s)
          p=Path('scripts/test_frame_budget.mjs');s=p.read_text()+'''
          test('measurement rejects missing runtime and malformed options',async()=>{
           for(const opts of [{samples:1},{targetMs:0},{maximumDurationMs:0}])
            await assert.rejects(globalThis.voxyMeasureGpuBudget(opts),RangeError);
           await assert.rejects(globalThis.voxyMeasureGpuBudget({module:{}}),/not initialized/);
          });
          test('abort does not change settings or turn missing frames into success',async()=>{
           const c=new AbortController();c.abort();let reads=0;
           const module={_voxy_get_telemetry_json(){++reads;return 1;},
            UTF8ToString(){return JSON.stringify({frame:{count:10,cpu_ms:3}});}};
           const result=await globalThis.voxyMeasureGpuBudget({module,signal:c.signal,samples:2});
           assert.equal(result.status,'aborted');assert.equal(result.sample_count,0);
           assert.equal(result.hardware_acceptance_established,false);assert.equal(reads,1);
          });
          test('measurement reads newly completed envelopes, excluding old samples',async()=>{
           let reads=0;const module={_voxy_get_telemetry_json(){return ++reads;},
            UTF8ToString(ptr){return JSON.stringify({frame:{count:100,cpu_ms:4},
             render_gpu:packet(ptr<3?90:ptr*30+30,.9)});}};
           const report=await globalThis.voxyMeasureGpuBudget({module,samples:2,maximumDurationMs:1000});
           assert.equal(report.status,'sampled_budget_met');assert.equal(report.sample_count,2);
           assert.equal(report.first_sample_frame,120);assert.equal(report.last_sample_frame,150);
           assert.equal(report.hardware_acceptance_established,false);
          });
          ''';p.write_text(s)
          p=Path('scripts/smoke_integrated_wasm.mjs');s=p.read_text()
          a="    assert.equal(sample.telemetry.physics.backend,'webgpu_soft');"
          b=a+'''
              assert.equal(sample.telemetry.render_gpu.frame_interval_available,true);
              assert(sample.telemetry.render_gpu.gpu_frame_ms>0,'missing complete-frame timestamp');
              assert(sample.telemetry.render_gpu.render_width>0&&sample.telemetry.render_gpu.render_height>0);
              const budget=await call('Runtime.evaluate',{returnByValue:true,
                  expression:`(() => {const p=voxyModule._voxy_get_telemetry_json();
                      const t=JSON.parse(voxyModule.UTF8ToString(p));
                      return {api:typeof voxyMeasureGpuBudget,summary:VoxyFrameBudget.summarize([t.render_gpu])};})()`});
              if(budget.exceptionDetails)throw new Error(JSON.stringify(budget.exceptionDetails));
              assert.equal(budget.result.value.api,'function');
              assert.equal(budget.result.value.summary.status,'insufficient_samples');
              assert.equal(budget.result.value.summary.sample_count,1);
              report.budget_single_sample=budget.result.value.summary;'''
          assert s.count(a)==1;p.write_text(s.replace(a,b))
          PY
          python3 tools/test_water_fft_fusion.py
          python3 tools/test_periodic_gradient_lut.py
          python3 tools/test_water_material_work.py
          node --test scripts/test_frame_budget.mjs scripts/test_webgpu_timestamp_compat.mjs
          node --check scripts/test_water_fft_fusion.mjs
          node --check scripts/smoke_integrated_wasm.mjs
          git diff --check
          git add shaders/water_finalize.wgsl scripts/test_water_fft_fusion.mjs scripts/test_frame_budget.mjs scripts/smoke_integrated_wasm.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: keep faster ocean FFT and remove slower finalize experiment'
          git push origin HEAD:refs/heads/perf/frame-budget-1ms
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  gpu:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_water_fft_fusion.mjs
      - run: node --test scripts/test_frame_budget.mjs scripts/test_webgpu_timestamp_compat.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-water-fft-fusion-report
          path: water-fft-fusion-report.json
          if-no-files-found: ignore
  wasm:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      EM_CACHE_FOLDER: emsdk-cache
      EMSCRIPTEN_VERSION: '6.0.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ccache mesa-vulkan-drivers xvfb
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-frame-budget-final-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ${{ env.EM_CACHE_FOLDER }}
          key: emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}-emdawnwebgpu
          restore-keys: |
            emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}-
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}
      - run: embuilder build emdawnwebgpu
      - uses: actions/cache@v4
        id: deps
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('scripts/fetch_deps.sh') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: bash scripts/fetch_deps.sh
      - run: git restore -- third_party/CMakeLists.txt third_party/BUILD third_party/tinygltf
      - run: emcmake cmake -S . -B build-wasm -DVOXY_BUILD_NATIVE=OFF -DVOXY_BUILD_WASM=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Production WASM build
        run: cmake --build build-wasm -- -j$(nproc)
      - name: Prepare exact candidate browser page
        run: |
          mkdir smoke-web
          cp -r web/* smoke-web/
          cp build-wasm/bin/voxy_wasm.{js,wasm,data} smoke-web/
          sed -i 's/__VOXY_BUILD_ID__/${{ needs.prepare.outputs.candidate }}/g' smoke-web/index.html
          mkdir -p /tmp/voxys-runtime && chmod 700 /tmp/voxys-runtime
          mapfile -t ICDS < <(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -type f)
          test "${#ICDS[@]}" -eq 1
          echo "VK_ICD_FILENAMES=${ICDS[0]}" >> "$GITHUB_ENV"
      - name: Exact binary startup, complete-frame timer and GPU retirement
        env:
          XDG_RUNTIME_DIR: /tmp/voxys-runtime
        run: xvfb-run -a node scripts/smoke_integrated_wasm.mjs smoke-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-frame-budget-browser-report
          path: '*startup*report.json'
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: final-frame-budget-browser-build
          path: smoke-web
          retention-days: 3
