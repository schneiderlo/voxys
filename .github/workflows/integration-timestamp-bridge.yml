name: WASM timestamp bridge validation
on:
  push:
    branches: [integration/optimization-rollup]
    paths: [.github/workflows/integration-timestamp-bridge.yml]
permissions:
  contents: read
  actions: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.patch.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: patch
        name: Translate only the C timestamp sentinel at the owned device boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/loader.js');s=p.read_text()
          a='async function requestVoxyDevice(adapter, { enableTimestamps = false } = {}) {'
          helper='''// The pinned emdawnwebgpu bridge forwards the C UINT32_MAX sentinel as
          // a numeric JS query index. WebGPU needs the optional property omitted.
          // Scope this adapter to renderer-owned devices; never patch global GPU
          // prototypes or suppress other invalid indices/validation failures.
          const timestampCompatibleDevices = new WeakSet();
          function normalizeTimestampDescriptor(descriptor) {
              const writes = descriptor?.timestampWrites;
              const undefinedIndex = 0xffffffff;
              if (!writes || (writes.beginningOfPassWriteIndex !== undefinedIndex
                  && writes.endOfPassWriteIndex !== undefinedIndex)) return descriptor;
              const normalized = {...writes};
              for (const key of ['beginningOfPassWriteIndex', 'endOfPassWriteIndex']) {
                  if (normalized[key] === undefinedIndex) delete normalized[key];
              }
              // Preserve invalid no-endpoint requests so WebGPU still rejects them.
              return {...descriptor, timestampWrites: normalized};
          }
          function installTimestampCompatibility(device) {
              if (typeof device?.createCommandEncoder !== 'function'
                  || timestampCompatibleDevices.has(device)) return;
              const create = device.createCommandEncoder;
              device.createCommandEncoder = function(...args) {
                  const encoder = Reflect.apply(create, this, args);
                  for (const name of ['beginRenderPass', 'beginComputePass']) {
                      const begin = encoder[name];
                      encoder[name] = function(descriptor) {
                          return Reflect.apply(begin, this,
                              [normalizeTimestampDescriptor(descriptor)]);
                      };
                  }
                  return encoder;
              };
              timestampCompatibleDevices.add(device);
          }

          '''
          assert s.count(a)==1 and 'function normalizeTimestampDescriptor' not in s
          s=s.replace(a,helper+a)
          a='    let adapterInfo = adapter.info;'
          assert s.count(a)==1;s=s.replace(a,'    installTimestampCompatibility(device);\n'+a)
          p.write_text(s)
          p=Path('web/index.html');s=p.read_text()
          a='<script src="loader.js"></script>'
          assert s.count(a)==1;p.write_text(s.replace(a,'<script src="loader.js?v=__VOXY_BUILD_ID__"></script>'))
          p=Path('scripts/smoke_integrated_wasm.mjs');s=p.read_text()
          s=s.replace("'--use-vulkan=swiftshader'","'--use-vulkan=native'")
          s=s.replace("'--use-webgpu-adapter=swiftshader',",'')
          p.write_text(s)
          PY
          node --test scripts/test_webgpu_timestamp_compat.mjs
          node --check web/loader.js
          node --check scripts/smoke_integrated_wasm.mjs
          git diff --check
          git add web/loader.js web/index.html scripts/smoke_integrated_wasm.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: translate emdawn timestamp sentinel before browser pass creation'
          git push origin HEAD:refs/heads/integration/optimization-rollup
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  browser:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools xvfb
      - uses: actions/download-artifact@v4
        with:
          name: integrated-wasm
          run-id: 33933267595
          github-token: ${{ github.token }}
          path: compiled
      - name: Prepare integration binary and current browser bridge
        run: |
          set -euo pipefail
          mkdir smoke-web
          cp -r web/* smoke-web/
          cp compiled/voxy_wasm.{js,wasm,data} smoke-web/
          sed -i 's/__VOXY_BUILD_ID__/b0cf3a4179fafb2a235b8dbd26b06846ebb9ef45/g' smoke-web/index.html
          mkdir -p /tmp/voxys-runtime && chmod 700 /tmp/voxys-runtime
          mapfile -t ICDS < <(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -type f)
          test "${#ICDS[@]}" -eq 1
          echo "VK_ICD_FILENAMES=${ICDS[0]}" >> "$GITHUB_ENV"
      - name: Actual terrain and course GPU retirement with profiling enabled
        env:
          XDG_RUNTIME_DIR: /tmp/voxys-runtime
          VOXY_SMOKE_SHADER_DIR: shaders
        run: xvfb-run -a node scripts/smoke_integrated_wasm.mjs smoke-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timestamp-bridge-startup-reports
          path: '*startup*report.json'
          if-no-files-found: ignore
