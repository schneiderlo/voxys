name: Runtime integration repair
on:
  push:
    branches: [integration/optimization-rollup]
    paths: [.github/workflows/integration-runtime-fix.yml]
permissions:
  contents: read
  actions: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.patch.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: patch
        name: Release ended bake pass before queue submission
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/render/periodic_gradient_lut.hpp');s=p.read_text()
          a='        wgpuComputePassEncoderEnd(pass.get());\n'
          b=a+'''        // wgpu-native retains the command buffer through a live pass handle.
                  // End recording AND release that handle before finish/submit.
                  // This is host object lifetime management, not a GPU wait.
                  wgpuComputePassEncoderRelease(pass.release());
          '''
          assert s.count(a)==1;p.write_text(s.replace(a,b))
          p=Path('tools/test_periodic_gradient_lut.py');s=p.read_text()
          a='    def test_background_timing_is_not_silently_excluded(self):'
          b='''    def test_bake_pass_released_before_submission(self):
                  source=(ROOT / 'src/render/periodic_gradient_lut.hpp').read_text()
                  end=source.index('wgpuComputePassEncoderEnd(pass.get())')
                  release=source.index('wgpuComputePassEncoderRelease(pass.release())')
                  finish=source.index('wgpuCommandEncoderFinish(encoder.get()')
                  submit=source.index('wgpuQueueSubmit(queue')
                  self.assertLess(end,release)
                  self.assertLess(release,finish)
                  self.assertLess(finish,submit)

          '''+a
          assert s.count(a)==1;p.write_text(s.replace(a,b))
          p=Path('scripts/smoke_integrated_wasm.mjs');s=p.read_text()
          a="    '--use-angle=swiftshader','--remote-debugging-port=0'"
          b="    '--use-angle=vulkan','--enable-features=Vulkan','--use-vulkan=swiftshader',\n    '--use-webgpu-adapter=swiftshader','--disable-vulkan-surface','--remote-debugging-port=0'"
          assert s.count(a)==1;p.write_text(s.replace(a,b))
          PY
          python3 tools/test_periodic_gradient_lut.py
          python3 tools/test_water_material_work.py
          node --check scripts/smoke_integrated_wasm.mjs
          git diff --check
          git add src/render/periodic_gradient_lut.hpp tools/test_periodic_gradient_lut.py scripts/smoke_integrated_wasm.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: release gradient bake pass before native queue submission'
          git push origin HEAD:refs/heads/integration/optimization-rollup
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ccache libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev mesa-vulkan-drivers xvfb
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-native-integration-${{ github.sha }}
          restore-keys: ccache-native-integration-
      - uses: actions/cache@v4
        id: deps
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('scripts/fetch_deps.sh') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: bash scripts/fetch_deps.sh
      - run: git restore -- third_party/CMakeLists.txt third_party/BUILD third_party/tinygltf
      - run: cmake -S . -B build-native -DVOXY_BUILD_NATIVE=ON -DVOXY_BUILD_WASM=OFF -DVOXY_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build all native targets
        run: cmake --build build-native -j4 > native-build.log 2>&1 || { tail -100 native-build.log; exit 1; }
      - name: Renderer initialization regressions
        env:
          XDG_RUNTIME_DIR: /tmp/voxys-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a ctest --test-dir build-native -R '^BlitPathTest\.' --output-on-failure -j2 --timeout 120 > native-renderer.log 2>&1 || { cat native-renderer.log; exit 1; }
      - name: Full native regression suite
        env:
          XDG_RUNTIME_DIR: /tmp/voxys-runtime
        run: xvfb-run -a ctest --test-dir build-native --output-on-failure -j2 --timeout 120 > native-tests.log 2>&1 || { tail -180 native-tests.log; exit 1; }
      - name: Record unchanged cove source and original shader expectations
        if: always()
        run: |
          git diff 3f06f364ce65a01da2abedc6a880c908903eee3a HEAD -- src/terrain/authored_cove.cpp src/terrain/authored_cove.hpp tests/test_heightmap.cpp tests/test_shader_blit.cpp > preexisting-cove-test-diff.txt
          git show 3f06f364ce65a01da2abedc6a880c908903eee3a:shaders/ray_blit.wgsl > original-main-ray_blit.wgsl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-repair-native
          path: |
            native-build.log
            native-renderer.log
            native-tests.log
            preexisting-cove-test-diff.txt
            original-main-ray_blit.wgsl
            build-native/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.ccache
          key: ccache-native-integration-${{ github.sha }}
  browser:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: integrated-wasm
          run-id: 33933267595
          github-token: ${{ github.token }}
          path: compiled
      - name: Package integration binary with current shaders
        run: |
          mkdir smoke-web
          cp -r web/* smoke-web/
          cp compiled/voxy_wasm.{js,wasm,data} smoke-web/
          sed -i 's/__VOXY_BUILD_ID__/b0cf3a4179fafb2a235b8dbd26b06846ebb9ef45/g' smoke-web/index.html
      - name: Retired GPU frames in isolated Vulkan software browsers
        env:
          VOXY_SMOKE_SHADER_DIR: shaders
        run: node scripts/smoke_integrated_wasm.mjs smoke-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-repair-browser
          path: '*startup*report.json'
          if-no-files-found: ignore
