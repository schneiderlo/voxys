name: Optimization integration
on:
  push:
    branches: [integration/optimization-rollup]
    paths: [.github/workflows/optimization-integration.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare merge and conflict evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach 3f06f364ce65a01da2abedc6a880c908903eee3a
          git merge --no-ff --no-commit 84fba7856cc19257f985e3f1ef40f8b4ce545751 || test "$(git diff --name-only --diff-filter=U)" = src/render/blit_path.cpp
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/render/blit_path.cpp');s=p.read_text()
          s,n=re.subn(r'<<<<<<< HEAD\n.*?=======\n(.*?)>>>>>>> [^\n]+\n',lambda m:m[1],s,flags=re.S)
          assert n==5,n
          assert 'periodicGradientLut_' in s and 'deferTimestampEnd' in s
          p.write_text(s)
          PY
          git add src/render/blit_path.cpp
          git commit -m 'Merge water material work with gradient lookup'
          git merge --no-ff --no-commit 19134562d032945072ddd463b021f2d93d886737 || true
          mkdir -p /tmp/integration-source/conflicts
          git diff --cc > /tmp/integration-source/conflicts/diff.txt
          git diff --name-only --diff-filter=U > /tmp/integration-source/conflicts/files.txt
          while IFS= read -r p; do
            mkdir -p "/tmp/integration-source/conflicts/$(dirname "$p")"
            git show ":1:$p" > "/tmp/integration-source/conflicts/$p.base" || true
            git show ":2:$p" > "/tmp/integration-source/conflicts/$p.ours" || true
            git show ":3:$p" > "/tmp/integration-source/conflicts/$p.theirs" || true
          done < /tmp/integration-source/conflicts/files.txt
          tar -czf /tmp/integration-source/source.tar.gz AGENTS.md src shaders tests scripts tools web docs CMakeLists.txt BUILD third_party/CMakeLists.txt third_party/BUILD third_party/tinygltf data/BUILD voxy.cfg
          cat /tmp/integration-source/conflicts/files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: integration-source
          path: /tmp/integration-source
