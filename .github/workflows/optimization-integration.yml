name: Optimization integration
on:
  push:
    branches: [integration/optimization-rollup]
    paths: [.github/workflows/optimization-integration.yml]
permissions:
  contents: read
concurrency:
  group: optimization-round
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.round.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the reviewed shading round
        id: round
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b0cf3a4179fafb2a235b8dbd26b06846ebb9ef45 HEAD
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/prepare_optimization_round.py')
          s=p.read_text()
          a='var refracted : vec3<f32>;'+chr(92)+'n    if (hasOpaqueRefraction)'
          b='var refracted : vec3<f32>;'+chr(92)*2+'n    if (hasOpaqueRefraction)'
          assert s.count(a)==1
          exec(compile(s.replace(a,b),str(p),'exec'))
          PY
          python3 tools/test_periodic_gradient_lut.py
          python3 tools/test_water_material_work.py
          node --check scripts/test_water_material_work.mjs
          git diff --check
          git add shaders/ray_blit.wgsl shaders/water_clipmap.wgsl scripts/test_periodic_gradient_lut.mjs scripts/test_water_material_work.mjs tools/test_water_material_work.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: skip unused underwater refraction and zero-contribution lighting'
          git push origin HEAD:refs/heads/integration/optimization-rollup
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  gpu:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/test_periodic_gradient_lut.py && python3 tools/test_water_material_work.py
      - name: GPU gradient lookup
        run: node scripts/test_periodic_gradient_lut.mjs
      - name: All changes against original scene shaders
        run: VOXY_WORK_REPORT=combined-original-report.json node scripts/test_water_material_work.mjs
      - name: Isolated next round including opt-in course
        run: VOXY_REFERENCE_REF=b0cf3a4179fafb2a235b8dbd26b06846ebb9ef45 VOXY_WORK_REPORT=shading-round-report.json node scripts/test_water_material_work.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimization-round-reports
          path: '*-report.json'
          if-no-files-found: ignore
