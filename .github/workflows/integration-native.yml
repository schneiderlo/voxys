name: Native integration validation
on:
  push:
    branches: [integration/optimization-rollup]
    paths: [.github/workflows/integration-native.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.patch.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Match native handles to the vendored GLFW backend
        id: patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('third_party/CMakeLists.txt');s=p.read_text()
          a='        add_subdirectory(glfw)'
          b=a+'''
                  if(UNIX AND NOT APPLE)
                      # The vendored fallback has no Wayland native-access symbols.
                      # Do not change system GLFW packages with both backends.
                      target_compile_definitions(glfw INTERFACE VOXY_GLFW_X11_ONLY=1)
                  endif()'''
          assert s.count(a)==1;p.write_text(s.replace(a,b))
          p=Path('src/engine/platform/native/window.cpp');s=p.read_text()
          for name in ['getWaylandDisplay','getWaylandSurface']:
              start=s.index('void* Window::'+name+'() const {');end=s.index('\n}',start)
              old=s[start:end+2]
              body=old[old.index('{')+1:-1].strip()
              new='void* Window::'+name+'() const {\n#if defined(VOXY_GLFW_X11_ONLY)\n    return nullptr;\n#else\n    '+body+'\n#endif\n}'
              s=s.replace(old,new)
          p.write_text(s)
          PY
          git add third_party/CMakeLists.txt src/engine/platform/native/window.cpp
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: avoid unavailable Wayland symbols in X11-only GLFW fallback'
          git push origin HEAD:refs/heads/integration/optimization-rollup
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ccache libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev mesa-vulkan-drivers xvfb
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-native-integration-${{ github.sha }}
          restore-keys: ccache-native-integration-
      - uses: actions/cache@v4
        id: deps
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('scripts/fetch_deps.sh') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: bash scripts/fetch_deps.sh
      - run: git restore -- third_party/CMakeLists.txt third_party/BUILD third_party/tinygltf
      - run: cmake -S . -B build-native -DVOXY_BUILD_NATIVE=ON -DVOXY_BUILD_WASM=OFF -DVOXY_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build all native targets
        run: cmake --build build-native -j4 -- -k > native-build.log 2>&1 || { tail -200 native-build.log; exit 1; }
      - name: Native regression suite
        env:
          XDG_RUNTIME_DIR: /tmp/voxys-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a ctest --test-dir build-native --output-on-failure -j2 --timeout 120 > native-tests.log 2>&1 || { tail -200 native-tests.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-native-results
          path: |
            native-build.log
            native-tests.log
            build-native/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.ccache
          key: ccache-native-integration-${{ github.sha }}
