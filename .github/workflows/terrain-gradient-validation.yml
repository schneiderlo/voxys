name: Isolated terrain gradient validation
on:
  push:
    branches: [work/terrain-gradient-lut-validation]
permissions:
  contents: read
concurrency:
  group: terrain-gradient-validation
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive current renderer sources for local validation
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/renderer-source.tar.gz" HEAD src shaders tests scripts tools settings third_party cmake BUILD CMakeLists.txt WORKSPACE MODULE.bazel .bazelrc .bazelversion AGENTS.md
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-source
          path: ${{ runner.temp }}/renderer-source.tar.gz
          retention-days: 1
