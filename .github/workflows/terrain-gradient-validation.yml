name: Isolated terrain gradient validation
on:
  push:
    branches: [work/terrain-gradient-lut-validation]
permissions:
  contents: read
concurrency:
  group: terrain-gradient-followup-validation
  cancel-in-progress: true
jobs:
  refine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/terrain-gradient-lut
      - name: Refine test lifecycle and production pipeline coverage
        id: publish
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2add98515608b1bb377ecff2397b475fea2b3e6f
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/test_periodic_gradient_lut.mjs')
          s = p.read_text()
          old = '''    clearTimeout(watchdog); socket?.close(); chrome.kill('SIGKILL');
              await new Promise(resolve => server.close(resolve));
              await rm(directory, {recursive: true, force: true});'''
          new = '''    clearTimeout(watchdog);
              socket?.close();
              // The profile is still being written until Chrome and its stdio close.
              // Waiting first avoids ENOTEMPTY after otherwise successful GPU tests.
              if (chrome.exitCode === null && chrome.signalCode === null && !chromeError) {
                  const closed = new Promise(resolve => chrome.once('close', resolve));
                  chrome.kill('SIGKILL');
                  await closed;
              }
              await new Promise(resolve => server.close(resolve));
              await rm(directory, {recursive: true, force: true, maxRetries: 8, retryDelay: 100});'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '    const texture = device.createTexture({'
          new = '''    // Compile the actual entry points too, not just the WGSL front end.
              // Both specializations must satisfy portable resource limits.
              for (const enabled of [0, 1]) {
                  const constants = {USE_PERIODIC_GRADIENT_LUT: enabled};
                  await device.createRenderPipelineAsync({
                      layout: 'auto', vertex: {module: modules[0], entryPoint: 'vs'},
                      fragment: {module: modules[0], entryPoint: 'fsBackground',
                          constants, targets: [{format: 'rgba16float'}]},
                  });
                  await device.createRenderPipelineAsync({
                      layout: 'auto', vertex: {module: modules[0], entryPoint: 'vs'},
                      fragment: {module: modules[0], entryPoint: 'fsCachedOpaqueColor',
                          constants, targets: [{format: 'bgra8unorm'}]},
                  });
                  await device.createRenderPipelineAsync({
                      layout: 'auto', vertex: {module: modules[1], entryPoint: 'vs',
                          buffers: [{arrayStride: 12, attributes: [
                              {shaderLocation: 0, offset: 0, format: 'float32x3'}]}]},
                      fragment: {module: modules[1], entryPoint: 'fsColor',
                          constants, targets: [{format: 'bgra8unorm'}]},
                  });
              }
              const texture = device.createTexture({'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = 'compiled_modules: 4,'
          assert s.count(old) == 1
          s = s.replace(old, 'compiled_modules: 4, compiled_render_pipelines: 6,')
          p.write_text(s)
          PY
          python3 tools/test_periodic_gradient_lut.py
          node --check scripts/test_periodic_gradient_lut.mjs
          git add scripts/test_periodic_gradient_lut.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: validate production gradient pipelines and await browser cleanup'
          git push origin HEAD:refs/heads/perf/terrain-gradient-lut
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  gpu:
    needs: refine-tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.refine-tests.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/test_periodic_gradient_lut.py
      - run: node scripts/test_periodic_gradient_lut.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: periodic-gradient-gpu-report
          path: periodic-gradient-lut-report.json
          if-no-files-found: ignore
