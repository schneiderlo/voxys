name: Isolated terrain gradient validation
on:
  push:
    branches: [work/terrain-gradient-lut-validation]
permissions:
  contents: read
concurrency:
  group: terrain-gradient-validation
  cancel-in-progress: true
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and unpack prepared implementation
        run: |
          cat tools/terrain-gradient-candidate.part0{0,1,2,3,4} > "$RUNNER_TEMP/candidate.patch.gz"
          test "$(git hash-object "$RUNNER_TEMP/candidate.patch.gz")" = eaab5fd262f8d99a51bc6daa1c9ee3013dcd19f2
          gzip -dc "$RUNNER_TEMP/candidate.patch.gz" > "$RUNNER_TEMP/candidate.patch"
      - uses: actions/checkout@v4
        with:
          ref: perf/terrain-gradient-lut
          persist-credentials: true
      - name: Apply checked implementation to isolated feature branch
        id: publish
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 85b9a6472e6778427e1cbf13faddc1dc91cba641
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply --index "$RUNNER_TEMP/candidate.patch"
          # The permanent PR workflow is added separately through the connector.
          # This token publishes implementation files only, never workflows/main.
          git rm -f .github/workflows/periodic-gradient-lut.yml
          python3 tools/test_periodic_gradient_lut.py
          node --check scripts/test_periodic_gradient_lut.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: bake packed periodic gradients once for terrain and ocean shading'
          git push origin HEAD:refs/heads/perf/terrain-gradient-lut
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  gpu:
    needs: implement
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/test_periodic_gradient_lut.py
      - run: node scripts/test_periodic_gradient_lut.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: periodic-gradient-gpu-report
          path: periodic-gradient-lut-report.json
          if-no-files-found: ignore
  compile-wasm:
    needs: implement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EM_CACHE_FOLDER: emsdk-cache
      EMSCRIPTEN_VERSION: '6.0.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.candidate }}
          persist-credentials: false
      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: terrain-lut-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ${{ env.EM_CACHE_FOLDER }}
          key: emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}-emdawnwebgpu
          restore-keys: |
            emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}-
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}
      - run: embuilder build emdawnwebgpu
      - uses: actions/cache@v4
        id: dependencies
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('scripts/fetch_deps.sh') }}
      - if: steps.dependencies.outputs.cache-hit != 'true'
        run: chmod +x scripts/fetch_deps.sh && ./scripts/fetch_deps.sh
      - name: Configure production WASM target
        run: |
          emcmake cmake -S . -B build-wasm \
            -DVOXY_BUILD_NATIVE=OFF -DVOXY_BUILD_WASM=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Compile and link production WASM target
        run: cmake --build build-wasm -- -j$(nproc)
