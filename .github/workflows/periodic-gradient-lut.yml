name: Periodic gradient GPU regression
on:
  pull_request:
    paths:
      - 'shaders/ray_blit.wgsl'
      - 'shaders/water_clipmap.wgsl'
      - 'src/render/blit_path.*'
      - 'src/render/periodic_gradient_lut.hpp'
      - 'scripts/test_periodic_gradient_lut.mjs'
      - 'tools/test_periodic_gradient_lut.py'
      - '.github/workflows/periodic-gradient-lut.yml'
permissions:
  contents: read
jobs:
  gpu-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/test_periodic_gradient_lut.py
      - run: node scripts/test_periodic_gradient_lut.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: periodic-gradient-gpu-report
          path: periodic-gradient-lut-report.json
          if-no-files-found: ignore
