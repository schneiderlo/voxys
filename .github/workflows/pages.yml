name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Optional full source commit SHA (for a patch of the live release)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EM_CACHE_FOLDER: emsdk-cache
      EMSCRIPTEN_VERSION: '6.0.1'
      CCACHE_DIR: ${{ github.workspace }}/.compiler-cache
    steps:
      - name: Validate release source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if [[ -n "$SOURCE_COMMIT" && ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Source commit must be a full lowercase commit SHA'; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - name: Record release source
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Deploying source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache xvfb python3-pil
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ steps.source.outputs.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ${{ env.EM_CACHE_FOLDER }}
          key: emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}-emdawnwebgpu
          restore-keys: |
            emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}-
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}
      - run: embuilder build emdawnwebgpu
      - name: Cache Third Party
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('scripts/fetch_deps.sh') }}
      - name: Fetch dependencies
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        run: bash scripts/fetch_deps.sh
      - name: Restore tracked dependency definitions
        # The dependency cache contains older tracked build files as well as
        # downloads. Never let it replace the definitions from this commit.
        run: git restore -- third_party/CMakeLists.txt third_party/BUILD third_party/tinygltf
      - name: Check shared LEGO shader geometry
        run: |
          python3 scripts/sync_lego_surface.py --check
          if test -f scripts/sync_authored_shapes.py; then python3 scripts/sync_authored_shapes.py --check; fi
      - name: Configure CMake
        run: |
          emcmake cmake -S . -B build-wasm \
            -DVOXY_BUILD_NATIVE=OFF \
            -DVOXY_BUILD_WASM=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build WASM
        run: cmake --build build-wasm -- -j$(nproc)
      - name: Load packaged terrain with the WASM engine
        run: python3 scripts/check_wasm_lego_assets.py build-wasm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test the creative interface
        if: ${{ hashFiles('ui/package-lock.json') != '' }}
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          npm --prefix ui test
          git diff --exit-code -- web/build_ui.js web/build_ui.css web/build_ui_licenses.txt web/build_ui_manifest.json
      - name: Prepare deployment directory
        env:
          VOXY_BUILD_ID: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p docs
          cp -r web/* docs/
          sed -i "s/__VOXY_BUILD_ID__/${VOXY_BUILD_ID}/g" docs/index.html
          cp build-wasm/bin/voxy_wasm.js docs/
          cp build-wasm/bin/voxy_wasm.wasm docs/
          # voxy_wasm.data is the core pack; voxy_<pack>.data are optional
          # packs that only some experiences download.
          cp build-wasm/bin/voxy_*.data docs/
          touch docs/.nojekyll
          test -s docs/index.html
          test -s docs/voxy_wasm.js
          test -s docs/voxy_wasm.wasm
          test -s docs/voxy_wasm.data
          test -s docs/voxy_salvage.data
          test -s docs/voxy_moto.data
          test -s docs/voxy_materials.data
          if grep -q __VOXY_BUILD_ID__ docs/index.html; then
            echo 'ERROR: deployment build ID was not substituted'; exit 1
          fi
          for asset in \
            /data/generated/td_seed_1234_8192.ldh \
            /data/generated/td_seed_1234_2048_albedo.jpg \
            /data/generated/ocean_environment.png \
            /ridgebreak.cfg \
            /lego_shore.cfg \
            /lego_world.cfg \
            /data/lego_shore.ldh; do
            grep -a -q "$asset" docs/voxy_wasm.js || {
              echo "ERROR: preload manifest missing $asset"; exit 1;
            }
          done
          # Optional packs mount their files from voxy_wasm.js as well.
          for asset in /data/moto/bike.vmesh /data/salvage/robot-r01/robot.vmesh /data/materials/Rock050_1K-JPG_Color.jpg; do
            grep -a -q "$asset" docs/voxy_wasm.js || {
              echo "ERROR: optional pack manifest missing $asset"; exit 1;
            }
          done
          python3 scripts/write_release_manifest.py docs --max-core-mib 97
          if test -f salvage.cfg; then
            grep -a -q /salvage.cfg docs/voxy_wasm.js || {
              echo 'ERROR: preload manifest missing /salvage.cfg'; exit 1;
            }
          fi
          ls -lah docs/
      - name: Loading animation timing regression
        run: node --test scripts/test_loading_roller.mjs scripts/test_data_packs.mjs
      - name: Start the main page through the full browser application
        id: main_page_smoke
        env:
          VOXY_SMOKE_GPU: swiftshader-window
        run: xvfb-run -a node scripts/smoke_integrated_wasm.mjs docs default
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-page-startup
          path: |
            integrated-startup-report.json
            startup-default.png
          if-no-files-found: ignore
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
