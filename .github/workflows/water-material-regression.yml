name: Integrated water and material regression

on:
  push:
    branches: [main]
    paths:
      - shaders/**
      - src/render/**
      - src/app/**
      - src/engine/platform/**
      - scripts/test_*gradient*.mjs
      - scripts/test_water_material_work.mjs
      - scripts/test_webgpu_timestamp_compat.mjs
      - tools/test_periodic_gradient_lut.py
      - tools/test_water_material_work.py
      - voxy.cfg
      - ridgebreak.cfg
      - web/index.html
      - web/loader.js
      - .github/workflows/water-material-regression.yml
  pull_request:
    paths:
      - shaders/**
      - src/render/**
      - src/app/**
      - src/engine/platform/**
      - scripts/test_*gradient*.mjs
      - scripts/test_water_material_work.mjs
      - scripts/test_webgpu_timestamp_compat.mjs
      - tools/test_periodic_gradient_lut.py
      - tools/test_water_material_work.py
      - voxy.cfg
      - ridgebreak.cfg
      - web/index.html
      - web/loader.js
      - .github/workflows/water-material-regression.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: integrated-shading-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  shader-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CPU and resource-contract regressions
        run: python3 tools/test_periodic_gradient_lut.py && python3 tools/test_water_material_work.py
      - name: WASM timestamp bridge regressions
        run: node --test scripts/test_webgpu_timestamp_compat.mjs
      - name: GPU gradient differential tests
        run: node scripts/test_periodic_gradient_lut.mjs
      - name: Combined water and terrain against original shaders
        run: VOXY_WORK_REPORT=combined-original-report.json node scripts/test_water_material_work.mjs
      - name: Next shading round including optional course
        run: VOXY_REFERENCE_REF=b0cf3a4179fafb2a235b8dbd26b06846ebb9ef45 VOXY_WORK_REPORT=shading-round-report.json node scripts/test_water_material_work.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-shading-reports
          path: '*-report.json'
          if-no-files-found: ignore
# Software GPU timings are retained for diagnosis, never represented as
# Intel hardware or whole-application FPS acceptance.
