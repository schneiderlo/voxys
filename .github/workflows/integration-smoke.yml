name: Isolated application startup
on:
  push:
    branches: [integration/optimization-rollup]
    paths: [.github/workflows/integration-smoke.yml]
permissions:
  contents: read
  actions: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: integrated-wasm
          run-id: 33933267595
          github-token: ${{ github.token }}
          path: compiled
      - name: Package compiled integration with current web assets
        run: |
          mkdir smoke-web
          cp -r web/* smoke-web/
          cp compiled/voxy_wasm.{js,wasm,data} smoke-web/
          sed -i 's/__VOXY_BUILD_ID__/b0cf3a4179fafb2a235b8dbd26b06846ebb9ef45/g' smoke-web/index.html
          node --check scripts/smoke_integrated_wasm.mjs
      - name: Real startup with current shader sources and independent browsers
        env:
          VOXY_SMOKE_SHADER_DIR: shaders
        run: node scripts/smoke_integrated_wasm.mjs smoke-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-startup-reports
          path: '*startup*report.json'
          if-no-files-found: ignore
