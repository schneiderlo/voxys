name: Native renderer regression
on:
  push:
    branches: [main]
    paths:
      - src/render/**
      - src/gpu/**
      - src/engine/platform/native/**
      - third_party/CMakeLists.txt
      - tests/test_blit_path.cpp
      - tests/test_raycast_path.cpp
      - tests/test_lego_surface.cpp
      - tests/test_lego_playground.cpp
      - tests/test_primitive_path.cpp
      - src/game/lego*
      - src/physics/**
      - src/terrain/lego*.hpp
      - src/terrain/compression.*
      - tests/test_compression.cpp
      - shaders/**
      - scripts/*lego*
      - tests/CMakeLists.txt
      - .github/workflows/native-renderer-regression.yml
  pull_request:
    paths:
      - src/render/**
      - src/gpu/**
      - src/engine/platform/native/**
      - third_party/CMakeLists.txt
      - tests/test_blit_path.cpp
      - tests/test_raycast_path.cpp
      - tests/test_lego_surface.cpp
      - tests/test_lego_playground.cpp
      - tests/test_primitive_path.cpp
      - src/game/lego*
      - src/physics/**
      - src/terrain/lego*.hpp
      - src/terrain/compression.*
      - tests/test_compression.cpp
      - shaders/**
      - scripts/*lego*
      - tests/CMakeLists.txt
      - .github/workflows/native-renderer-regression.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-renderer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ccache libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev mesa-vulkan-drivers xvfb
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-native-integration-${{ github.sha }}
          restore-keys: ccache-native-integration-
      - uses: actions/cache@v4
        id: deps
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('scripts/fetch_deps.sh') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: bash scripts/fetch_deps.sh
      - run: git restore -- third_party/CMakeLists.txt third_party/BUILD third_party/tinygltf
      - name: Configure native renderer tests
        run: cmake -S . -B build-native -DVOXY_BUILD_NATIVE=ON -DVOXY_BUILD_WASM=OFF -DVOXY_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build build-native --target voxy_tests -j4
      - name: Terrain checksum and compatibility regression tests
        run: ctest --test-dir build-native -R '^(CRC32Test|CompressionTest|HeaderTest|FileIOTest)\.' --output-on-failure --timeout 120
      - name: Native renderer lifetime and resource regression tests
        env:
          XDG_RUNTIME_DIR: /tmp/voxys-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a ctest --test-dir build-native -R '^(BlitPathTest|RaycastPathGPUTest|LegoSurface|LegoPlaygroundGpu|PrimitivePathGPUTest|PrimitiveMaterialTest|CpuCapsuleMover)\.' --output-on-failure -j2 --timeout 120
      - name: Shared LEGO geometry and GPU regression
        env:
          XDG_RUNTIME_DIR: /tmp/voxys-runtime
        run: |
          python3 -m pip install numpy wgpu==0.32.0
          python3 scripts/sync_lego_surface.py --check
          python3 scripts/test_lego_surface_gpu.py
          python3 scripts/test_lego_rendering.py
          VOXY_LEGO_STUDY=1 python3 scripts/test_lego_rendering.py
          VOXY_LEGO_MODE=4 python3 scripts/test_lego_rendering.py
          python3 scripts/test_lego_layout_gpu.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-renderer-test-log
          path: build-native/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
# This focused lifetime/resource gate does not replace the complete CTest suite
# or target-hardware visual/performance acceptance. See validation status docs.
