name: Temporary water material validation
on:
  push:
    branches: [perf/water-terrain-work-reduction]
    paths: [.github/workflows/water-material-bootstrap.yml]
permissions:
  contents: read
concurrency:
  group: water-material-followup
  cancel-in-progress: false
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Separate warmed samples from first-use compilation
        id: publish
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_water_material_work.mjs')
          s=p.read_text()
          s=s.replace('const textures=[];\n        const query=', 'const textures=[],pipelines=[],targetSets=[];\n        const query=')
          s=s.replace("            const pass=encoder.beginRenderPass({colorAttachments:targets.map(t=>", "            pipelines.push(pipeline);targetSets.push(targets);\n            const pass=encoder.beginRenderPass({colorAttachments:targets.map(t=>",1)
          a="        staging.unmap();staging.destroy();input.destroy();unused.destroy();textures.forEach(t=>t.destroy());"
          b="""        staging.unmap();staging.destroy();
                  const check=report.checks.at(-1);
                  if(query){await timeRead.mapAsync(GPUMapMode.READ);
                      const t=new BigUint64Array(timeRead.getMappedRange().slice(0));
                      check.first_pass_gpu_ms={reference:Number(t[1]-t[0])/1e6,
                          candidate:Number(t[3]-t[2])/1e6};timeRead.unmap();}
                  // Cold draws may include software-driver JIT. Keep them separate from
                  // warmed, alternating-order samples; neither is a game-FPS benchmark.
                  const warmed=[];
                  for(let repeat=0;repeat<9;++repeat){
                      const batch=device.createCommandEncoder();
                      const order=repeat%2?[1,0]:[0,1];
                      for(const i of order){
                          const pass=batch.beginRenderPass({colorAttachments:targetSets[i].map(t=>({
                              view:t.createView(),loadOp:'clear',storeOp:'store',
                              clearValue:{r:.125,g:.125,b:.125,a:.125}})),
                              ...(query?{timestampWrites:{querySet:query,
                                  beginningOfPassWriteIndex:i*2,endOfPassWriteIndex:i*2+1}}:{})});
                          pass.setPipeline(pipelines[i]);pass.setBindGroup(0,group0);
                          pass.setBindGroup(1,group1);pass.draw(3);pass.end();
                      }
                      if(query){batch.resolveQuerySet(query,0,4,resolved,0);
                          batch.copyBufferToBuffer(resolved,0,timeRead,0,32);}
                      device.queue.submit([batch.finish()]);
                      if(query){await timeRead.mapAsync(GPUMapMode.READ);
                          const t=new BigUint64Array(timeRead.getMappedRange().slice(0));
                          if(repeat>=3)warmed.push({reference:Number(t[1]-t[0])/1e6,
                              candidate:Number(t[3]-t[2])/1e6});
                          timeRead.unmap();
                      }else{await device.queue.onSubmittedWorkDone();}
                  }
                  check.warmed_paired_gpu_ms=warmed;
                  input.destroy();unused.destroy();textures.forEach(t=>t.destroy());"""
          assert s.count(a)==1
          s=s.replace(a,b)
          a="""        if(query){await timeRead.mapAsync(GPUMapMode.READ);const times=new BigUint64Array(timeRead.getMappedRange().slice(0));
                      report.checks.at(-1).single_pass_gpu_ms={reference:Number(times[1]-times[0])/1e6,candidate:Number(times[3]-times[2])/1e6};
                      timeRead.unmap();timeRead.destroy();resolved.destroy();query.destroy();}"""
          assert s.count(a)==1
          s=s.replace(a,"        if(query){timeRead.destroy();resolved.destroy();query.destroy();}")
          p.write_text(s)
          PY
          node --check scripts/test_water_material_work.mjs
          git add scripts/test_water_material_work.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: add warmed alternating shader diagnostics'
          git push origin HEAD:refs/heads/perf/water-terrain-work-reduction
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  gpu:
    needs: refine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.refine.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/test_water_material_work.py
      - run: node scripts/test_water_material_work.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: water-material-gpu-report
          path: water-material-work-report.json
          if-no-files-found: ignore
