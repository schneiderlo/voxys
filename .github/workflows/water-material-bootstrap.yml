name: Temporary water material validation
on:
  push:
    branches: [perf/water-terrain-work-reduction]
    paths: [.github/workflows/water-material-bootstrap.yml]
permissions:
  contents: read
jobs:
  terrain-variant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cf4559fb093300068c56f1bc8a422430ac2979d6
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolate work masks without footprint sharing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shaders/ray_blit.wgsl')
          s=p.read_text()
          a='''    let footprint = terrainMaterialUvFootprint(
                  projectedWorld, projectedX, projectedY, layer);
              let uv = footprint[0];
              let uvX = footprint[1];
              let uvY = footprint[2];'''
          b='''    let uv = terrainMaterialUv(projectedWorld, layer);
              let uvX = terrainMaterialUv(projectedX, layer);
              let uvY = terrainMaterialUv(projectedY, layer);'''
          assert s.count(a)==1
          p.write_text(s.replace(a,b))
          PY
          git diff > independent-footprint-variant.patch
      - run: node scripts/test_water_material_work.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-footprint-variant
          path: |
            water-material-work-report.json
            independent-footprint-variant.patch
          if-no-files-found: error
