name: Temporary water material validation
on:
  push:
    branches: [perf/water-terrain-work-reduction]
    paths: [.github/workflows/water-material-bootstrap.yml]
permissions:
  contents: read
concurrency:
  group: water-material-final-validation
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove the regressed experiment and complete timestamp paths
        id: publish
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 9c51f509e6f3cd8289f91306e2df0735c9cd8824
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def change(s,a,b):
              assert s.count(a)==1,(a[:100],s.count(a))
              return s.replace(a,b)
          def fn(s,name):
              start=s.index('fn '+name+'('); depth=0
              for i in range(s.index('{',start),len(s)):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0: return s[start:i+1]
              raise AssertionError(name)
          p=Path('shaders/ray_blit.wgsl');s=p.read_text()
          original=subprocess.check_output(['git','show','d9a6a399a9cafdb986be992413de8322ac879b8c:shaders/ray_blit.wgsl'],text=True)
          a=s.index('// Reuse the four gradient corners')
          b=s.index('fn sampleTerrainLayer(',a)
          s=s[:a]+fn(original,'terrainMaterialUv')+'\n\n'+s[b:]
          s=change(s,'''    let footprint = terrainMaterialUvFootprint(
                  projectedWorld, projectedX, projectedY, layer);
              let uv = footprint[0];
              let uvX = footprint[1];
              let uvY = footprint[2];''','''    let uv = terrainMaterialUv(projectedWorld, layer);
              let uvX = terrainMaterialUv(projectedX, layer);
              let uvY = terrainMaterialUv(projectedY, layer);''')
          p.write_text(s)
          p=Path('src/render/blit_path.cpp');s=p.read_text()
          s=change(s,'''    const bool drawParticles =
                  cameraUnderwater && particlePipeline_ && particleBindGroup_;''','''    const bool drawParticles =
                  cameraUnderwater && particlePipeline_ && particleBindGroup_ &&
                  updateUnderwaterParticles();''')
          s=change(s,'''        if (timestampQuerySet) {
                      timestampWrites.querySet = timestampQuerySet;
                      timestampWrites.beginningOfPassWriteIndex = lightingTimestampStarted''','''        // The middle pass has no endpoints when background and particles
                  // bracket it. WebGPU requires at least one defined endpoint.
                  if (timestampQuerySet && (!lightingTimestampStarted || !drawParticles)) {
                      timestampWrites.querySet = timestampQuerySet;
                      timestampWrites.beginningOfPassWriteIndex = lightingTimestampStarted''')
          s=change(s,'''    if (drawParticles) {
                  if (!updateUnderwaterParticles()) return;
          ''','''    if (drawParticles) {
          ''')
          p.write_text(s)
          p=Path('scripts/test_water_material_work.mjs');s=p.read_text()
          s=change(s,'function mathProbe(source, candidate) {','function mathProbe(source) {')
          a=s.index('    const extra=');b=s.index('    const camera=',a)
          s=s[:a]+"    const helpers=common.map(n=>fn(source,n)).join('\\n');\n"+s[b:]
          a=s.index('    let uv=${candidate?');b=s.index('    result[id.x*3u]',a)
          s=s[:a]+'    let uv=mat3x2<f32>(terrainMaterialUv(c.p.xz,layer),terrainMaterialUv(c.x.xz,layer),terrainMaterialUv(c.y.xz,layer));\n'+s[b:]
          s=change(s,'mathProbe(before[0],false),mathProbe(after[0],true)','mathProbe(before[0]),mathProbe(after[0])')
          a=s.index('    // Isolate the sharing tradeoff');b=s.index('    // Actual production entry points',a)
          s=s[:a]+s[b:]
          s=change(s,"""    await fragmentPair([shaders[0],independent],'surfaceFixture',['rgba32float','rgba32float'],samples,
                  'diagnostic independent footprint: mixed terrain');
          """,'')
          s=change(s,"""        await fragmentPair([shaders[0],independent],'surfaceFixture',['rgba32float','rgba32float'],coherent,
                      'diagnostic coherent '+kind+': independent footprint');
          """,'')
          s=s.replace("'coherent '+kind+': shared footprint'","'coherent '+kind+': material'")
          s=s.replace("'UV footprints and material weights'","'material coordinates and weights'")
          s=s.replace('// Exact lattice/wrap and large fp32 inputs also exercise reference fallback.','// Exact lattice/wrap and large fp32 inputs retain the original coordinate path.')
          s=change(s,"    report.status='passed';device.destroy();return report;",'''    // Exercise the exact beginning/middle/end timestamp topology of blit.
              if(timestamps){
                  device.pushErrorScope('validation');
                  const target=device.createTexture({size:[1,1],format:'rgba8unorm',usage:T.RENDER_ATTACHMENT});
                  const q=device.createQuerySet({type:'timestamp',count:2});
                  const resolved=makeBuffer(16,B.QUERY_RESOLVE|B.COPY_SRC);
                  const readback=makeBuffer(16,B.COPY_DST|B.MAP_READ);
                  let paths=0;
                  for(const cached of [false,true])for(const refresh of [false,true])for(const particles of [false,true]){
                      const encoder=device.createCommandEncoder();const descriptors=[];
                      if(cached&&refresh)descriptors.push({querySet:q,beginningOfPassWriteIndex:0});
                      const middle={};
                      if(!(cached&&refresh))middle.beginningOfPassWriteIndex=0;
                      if(!particles)middle.endOfPassWriteIndex=1;
                      descriptors.push(Object.keys(middle).length?{querySet:q,...middle}:null);
                      if(particles)descriptors.push({querySet:q,endOfPassWriteIndex:1});
                      for(const timestampWrites of descriptors){
                          const pass=encoder.beginRenderPass({colorAttachments:[{view:target.createView(),
                              loadOp:'clear',storeOp:'store',clearValue:[0,0,0,1]}],
                              ...(timestampWrites?{timestampWrites}:{})});pass.end();
                      }
                      encoder.resolveQuerySet(q,0,2,resolved,0);encoder.copyBufferToBuffer(resolved,0,readback,0,16);
                      device.queue.submit([encoder.finish()]);await readback.mapAsync(GPUMapMode.READ);
                      const t=new BigUint64Array(readback.getMappedRange().slice(0));
                      if(t[1]<t[0])throw new Error('invalid blit timestamp ordering');readback.unmap();++paths;
                  }
                  const error=await device.popErrorScope();if(error)throw new Error(error.message);
                  report.timestamp_paths=paths;target.destroy();q.destroy();resolved.destroy();readback.destroy();
              }
              report.status='passed';device.destroy();return report;''')
          p.write_text(s)
          p=Path('tools/test_water_material_work.py');s=p.read_text()
          a=s.index('    def test_shared_footprint_keeps_discontinuity_fallback');b=s.index('    def test_render_timestamps',a)
          s=s[:a]+'''    def test_original_material_coordinates_and_filtering(self):
                  for expression in ['let uv = terrainMaterialUv(projectedWorld, layer);',
                                     'let uvX = terrainMaterialUv(projectedX, layer);',
                                     'let uvY = terrainMaterialUv(projectedY, layer);',
                                     'let gradientX = uvX - uv;', 'let gradientY = uvY - uv;']:
                      self.assertIn(expression,RAY)
                  self.assertNotIn('periodicNoiseFootprint',RAY)
                  self.assertNotIn('@binding(19)',RAY)
                  self.assertNotIn('dpdx',RAY)
          
          '''+s[b:]
          a=s.index('    def test_footprints_same_cells_and_discontinuities');b=s.index('    def test_wet_band',a)
          s=s[:a]+'''    def test_cove_and_caustic_masks_are_exactly_zero(self):
                  for r in [80,81,100,1000]:
                      self.assertEqual(1-smooth(56,80,r),0)
                      self.assertEqual(1-smooth(50,78,r),0)
                  for distance in [145,150,1000]:
                      self.assertEqual(1-smooth(55,145,distance),0)
                  for depth in [52,100,1000]:
                      self.assertEqual(1-smooth(28,52,depth),0)
                  self.assertIn('if (coveZone > 0.0)',RAY)
                  self.assertIn('if (coveMask > 0.0)',RAY)
                  self.assertIn('if (depthFade == 0.0 || distanceFade == 0.0 || receiver == 0.0)',RAY)
          
              def test_fully_rockcovered_pixels_have_no_other_layers(self):
                  rng=random.Random(77)
                  for _ in range(1000):
                      rock=1.0
                      sand=rng.random()*rng.random()*(1-rock)
                      upland=max(1-rock-sand,0)
                      grass=upland*rng.random()
                      soil=max(upland-grass,0)
                      self.assertEqual((sand,soil,grass,rock),(0,0,0,1))
                  self.assertIn('if (rock == 1.0)',RAY)
          
          '''+s[b:]
          a=s.index('def f32(');b=s.index('def smooth(',a)
          s=s[:a]+s[b:]
          s=s.replace('import math\n','').replace('import struct\n','')
          s=s.replace("        self.assertIn('particleTimestamps.endOfPassWriteIndex = timestampEnd',BLIT)","        self.assertIn('particleTimestamps.endOfPassWriteIndex = timestampEnd',BLIT)\n        self.assertIn('if (timestampQuerySet && (!lightingTimestampStarted || !drawParticles))',BLIT)\n        self.assertEqual(BLIT.count('        updateUnderwaterParticles();'),1)")
          p.write_text(s)
          p=Path('docs/water-material-work-reduction.md');s=p.read_text()
          a=s.index('* Share noise');b=s.index('* Do not evaluate cove',a)
          s=s[:a]+'''* Retain the original texture-coordinate, noise and finite-difference mip
            gradients. The shared-gradient experiment was removed after warmed
            software comparisons regressed, including coherent terrain fixtures.
          '''+s[b:]
          s=s.replace('UV footprints/weights','material coordinates/weights')
          p.write_text(s)
          PY
          python3 tools/test_water_material_work.py
          node --check scripts/test_water_material_work.mjs
          git diff --check
          git add shaders/ray_blit.wgsl src/render/blit_path.cpp scripts/test_water_material_work.mjs tools/test_water_material_work.py docs/water-material-work-reduction.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: retain water work reductions and remove regressed gradient sharing'
          git push origin HEAD:refs/heads/perf/water-terrain-work-reduction
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/source"
          git archive HEAD shaders/ray_blit.wgsl shaders/water_clipmap.wgsl src/render/blit_path.cpp src/engine/platform/wasm/entry.cpp src/app/debug_overlay.cpp web/index.html scripts/test_water_material_work.mjs tools/test_water_material_work.py docs/water-material-work-reduction.md | tar -x -C "$RUNNER_TEMP/source"
          git diff --binary d9a6a399a9cafdb986be992413de8322ac879b8c HEAD -- shaders src web scripts tools/test_water_material_work.py docs/water-material-work-reduction.md > "$RUNNER_TEMP/source/candidate.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/source/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: water-material-final-source
          path: ${{ runner.temp }}/source
  gpu:
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.finalize.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/test_water_material_work.py
      - run: node scripts/test_water_material_work.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: water-material-final-gpu-report
          path: water-material-work-report.json
          if-no-files-found: ignore
  compile-wasm:
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EM_CACHE_FOLDER: emsdk-cache
      EMSCRIPTEN_VERSION: '6.0.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.finalize.outputs.candidate }}
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ccache
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-water-final-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ${{ env.EM_CACHE_FOLDER }}
          key: emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}-emdawnwebgpu
          restore-keys: |
            emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}-
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}
      - run: embuilder build emdawnwebgpu
      - uses: actions/cache@v4
        id: deps
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('scripts/fetch_deps.sh') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: chmod +x scripts/fetch_deps.sh && ./scripts/fetch_deps.sh
      - name: Configure production WASM
        run: emcmake cmake -S . -B build-wasm -DVOXY_BUILD_NATIVE=OFF -DVOXY_BUILD_WASM=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Compile and link production WASM
        run: cmake --build build-wasm -- -j$(nproc)
