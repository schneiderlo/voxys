# Authored sailing cove. Stepped brick terrain and round studs are shared by
# rendering, walking and authored hull/cargo contacts. Full game gates remain open.
[game]
mode = "salvage"
asset_fixture_registry = "data/salvage/fixture-cove-r01.json"
asset_fixture_lighting = "filtered"
asset_fixture_anchor = "water"
[window]
width = 1536
height = 864
title = "Cove Preview"
[render]
path = "raycast"
resolution_scale = 1
vsync = true
[terrain]
heightmap = "data/lego_shore.ldh"
albedo = ""
lightmap = ""
height_scale = 600
cell_scale = 1
ambient_light = 0.55
[physics]
backend = "webgpu"
# A bounded preview allocation; this is not a future game capacity claim.
gpu_max_bodies = 1024
allow_cpu_fallback = false
broad_phase_cell_size = 4
[water]
enabled = true
height = -200
shallow_color = [0.12, 0.43, 0.46]
deep_color = [0.025, 0.14, 0.20]
roughness = 0.24
wave_strength = 0.10
distortion = 0.04
reflection_strength = 0.22
shore_fade = 8
[camera]
fov = 60
near_plane = 0.1
far_plane = 1500
move_speed = 4
mouse_sensitivity = 0.0002
eye_height = 1.8
[lighting]
sun_direction = [0.4, 0.8, -0.4]
sun_color = [1.0, 0.96, 0.88]
# Linear sky-illumination multiplier for the inspection materials. The old
# primitive scene normalized this tint; the actual PBR path preserves its value.
ambient_color = [0.70, 0.75, 0.82]
fog_density = 0.0015
fog_color = [0.66, 0.77, 0.80]
[debug]
show_stats = false
enable_validation = true
