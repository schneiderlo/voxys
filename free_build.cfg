# Creative building on the full fixed LEGO-style landscape.
[game]
mode = "free-build"
[window]
width = 1536
height = 864
title = "Voxys — Free Build"
[render]
path = "raycast"
resolution_scale = 1
vsync = true
[terrain]
heightmap = "data/generated/td_seed_1234_8192.ldh"
albedo = ""
lightmap = ""
height_scale = 600
cell_scale = 1
ambient_light = 0.65
[physics]
backend = "webgpu"
# Room for repeated 100-brick throws alongside the imported scenery.
gpu_max_bodies = 1024
allow_cpu_fallback = false
broad_phase_cell_size = 4
[water]
enabled = true
height = -200
shallow_color = [0.12, 0.43, 0.46]
deep_color = [0.025, 0.14, 0.20]
roughness = 0.24
wave_strength = 0.10
distortion = 0.04
reflection_strength = 0.22
shore_fade = 8
[camera]
fov = 78
near_plane = 0.1
far_plane = 10000
move_speed = 4
mouse_sensitivity = 0.0002
eye_height = 1.8
[lighting]
# A gentle 24-minute day. Start in the morning; night stays bright enough to build.
day_night_enabled = true
day_cycle_minutes = 24
day_start_hour = 9
# Free building retains the engine's warm Low Golden Sun presentation.
# These fixed lighting values apply when the day/night cycle is disabled.
sun_direction = [0.4, 0.8, -0.4]
sun_color = [1.0, 0.96, 0.88]
# Linear sky-illumination multiplier shared by the terrain and building materials.
ambient_color = [0.62, 0.64, 0.72]
fog_density = 0.00022
fog_color = [0.66, 0.77, 0.80]
[debug]
show_stats = false
enable_validation = true
