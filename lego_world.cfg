# The complete original landscape, with the shared LEGO surface.
# K compares grouped / single-cell materials on identical physical terrain.
[window]
width = 1280
height = 720
title = "LEGO WORLD"
[render]
path = "raycast"
resolution_scale = 1
vsync = true
[terrain]
heightmap = "data/generated/td_seed_1234_8192.ldh"
# Brick colors come from the LEGO palette; do not inherit landscape imagery.
albedo = ""
lightmap = ""
height_scale = 600
cell_scale = 1
ambient_light = 0.55
[physics]
backend = "webgpu"
gpu_max_bodies = 256
allow_cpu_fallback = false
broad_phase_cell_size = 4
[water]
enabled = true
height = -200
shallow_color = [0.12, 0.43, 0.46]
deep_color = [0.025, 0.14, 0.20]
roughness = 0.24
wave_strength = 0.10
distortion = 0.04
reflection_strength = 0.22
shore_fade = 8
[camera]
fov = 60
near_plane = 0.1
far_plane = 10000
move_speed = 10
mouse_sensitivity = 0.0002
eye_height = 1.8
[lighting]
sun_direction = [0.4, 0.8, -0.4]
sun_color = [1.0, 0.96, 0.88]
ambient_color = [0.17, 0.20, 0.23]
fog_density = 0.0001
fog_color = [0.66, 0.77, 0.80]
[debug]
show_stats = false
enable_validation = true
