# The complete original landscape, with the shared LEGO surface.
# K compares grouped / single-cell materials on identical physical terrain.
[window]
width = 1280
height = 720
title = "LEGO WORLD"
[render]
path = "raycast"
resolution_scale = 1
vsync = true
[terrain]
heightmap = "data/generated/td_seed_1234_8192.ldh"
# Brick colors come from the LEGO palette; do not inherit landscape imagery.
albedo = ""
lightmap = ""
height_scale = 600
cell_scale = 1
ambient_light = 0.34
[physics]
backend = "webgpu"
# Reserve room for 20,000 thrown balls plus the building playground.
gpu_max_bodies = 32768
allow_cpu_fallback = false
broad_phase_cell_size = 4
[water]
enabled = true
height = -200
shallow_color = [0.12, 0.43, 0.46]
deep_color = [0.025, 0.14, 0.20]
roughness = 0.24
wave_strength = 0.10
distortion = 0.04
reflection_strength = 0.22
shore_fade = 8
[camera]
fov = 60
near_plane = 0.1
far_plane = 10000
move_speed = 10
mouse_sensitivity = 0.0002
eye_height = 1.8
[lighting]
# Azimuth -38 degrees, elevation 8 degrees.
sun_direction = [0.7803419, 0.1391731, -0.6096699]
sun_color = [1.0, 0.43, 0.16]
ambient_color = [0.18, 0.23, 0.42]
fog_density = 0.0001
fog_color = [0.48, 0.25, 0.20]
[debug]
show_stats = false
enable_validation = true
