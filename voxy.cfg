# voxy Configuration File
# =======================

# Config reload test
[window]
width = 1280
height = 720
fullscreen = false
title = "voxy"

[render]
path = "raycast"
resolution_scale = 1.
vsync = true
max_fps = 0

[terrain]
# Use the generated Terrain Diffusion heightmap.
heightmap = "data/generated/td_seed_1234_8192.ldh"
# heightmap = "data/Terrain004_8K.ldh"
# heightmap = "data/canyon_8k.ldh"
height_scale = 600.0
cell_scale = 1
albedo = "data/generated/td_seed_1234_8192_albedo.jpg"
ambient_light = 0.4

[water]
enabled = true
# Terrain Diffusion encodes sea level at zero.
# Lowering the plane exposes more of this ocean-heavy generated map.
height = -200.0
shallow_color = [0.10, 0.34, 0.34]
deep_color = [0.015, 0.14, 0.22]
roughness = 0.22
wave_strength = 0.58
# Reflection amount, range 0-1.
reflection_strength = 0.88
# Water depth (world units) over which the colour fades from shallow to deep.
shore_fade = 12.0

[camera]
fov = 60.0
near_plane = 0.1
far_plane = 10000.0
move_speed = 10.0
mouse_sensitivity = 0.0002
# Eye height above ground (scale with terrain for consistent feel)
eye_height = 1.8

[lighting]
sun_direction = [0.4, 0.8, 0.4]
sun_color = [1.0, 0.95, 0.9]
ambient_color = [0.1, 0.12, 0.15]
fog_density = 0.0001
fog_color = [0.6, 0.7, 0.8]

[debug]
show_stats = true
show_wireframe = false
log_level = "info"
enable_validation = true
