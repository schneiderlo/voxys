# voxy Configuration File
# =======================

# Config reload test
[window]
width = 1280
height = 720
fullscreen = false
title = "voxy"

[render]
path = "raycast"
resolution_scale = 1.
vsync = true
max_fps = 0

[terrain]
# Use the canyon heightmap.
heightmap = "data/canyon_8k.ldh"
# heightmap = "data/Terrain004_8K.ldh"
# heightmap = "data/generated/td_seed_1234_8192.ldh"
height_scale = 600.0
cell_scale = 1
albedo = "data/canyon_diffuse.jpg"
ambient_light = 0.4

[water]
enabled = true
height = -585.0
shallow_color = [0.12, 0.46, 0.50]
deep_color = [0.0, 0.28, 0.42]
roughness = 0.5
wave_strength = 0.8
# Reflection amount, range 0-1.
reflection_strength = 1.0
# Water depth (world units) over which the colour fades from shallow to deep.
shore_fade = 12.0

[camera]
fov = 60.0
near_plane = 0.1
far_plane = 10000.0
move_speed = 10.0
mouse_sensitivity = 0.0002
# Eye height above ground (scale with terrain for consistent feel)
eye_height = 1.8

[lighting]
sun_direction = [0.4, 0.8, 0.4]
sun_color = [1.0, 0.95, 0.9]
ambient_color = [0.1, 0.12, 0.15]
fog_density = 0.0001
fog_color = [0.6, 0.7, 0.8]

[debug]
show_stats = true
show_wireframe = false
log_level = "info"
enable_validation = true
